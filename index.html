<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هنا الكويتية للعقارات والمقاولات - مروان عمر</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- نافذة تسجيل الدخول السريعة -->
    <div id="authModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5 text-right">
            <h2 class="text-xl font-black text-slate-900 text-center"><i class="fa-solid fa-lock text-amber-500"></i> تسجيل دخول نظام الكويتية</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">اختر اسم المستخدم</label>
                    <select id="loginUserSelect" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl font-bold">
                        <option value="الاء">الاء (أدمن)</option>
                        <option value="ابو عمر">ابو عمر (مندوب)</option>
                        <option value="ابو صلاح">ابو صلاح (مندوب)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور</label>
                    <input type="password" id="userPasswordInput" required placeholder="أدخل كلمة المرور" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl font-bold">
                </div>
                <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-xl transition shadow-lg">دخول للنظام</button>
            </form>
        </div>
    </div>

    <!-- الهيدر العلوي -->
    <header class="bg-slate-900 text-white shadow-xl sticky top-0 z-40 border-b border-amber-500/30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-600 flex items-center justify-center text-slate-900 shadow-lg font-black text-2xl">
                    <i class="fa-solid fa-building-circle-check"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wide text-amber-400">هنا الكويتية للعقارات والمقاولات</h1>
                    <p class="text-xs text-slate-300 font-semibold flex items-center gap-1">
                        <i class="fa-solid fa-user-gear text-amber-400"></i> إشراف البشمهندس: <span class="text-white font-bold">مروان عمر</span>
                    </p>
                </div>
            </div>
            <div class="flex items-center space-x-2 space-x-reverse mt-2 sm:mt-0">
                <div id="currentUserBadge" class="text-xs px-3 py-1 bg-slate-800 text-amber-400 rounded-xl font-bold border border-slate-700"></div>
                <button onclick="logout()" class="bg-rose-900/50 hover:bg-rose-900 text-rose-200 px-3 py-1.5 rounded-xl text-xs font-semibold border border-rose-800 transition" title="خروج">
                    <i class="fa-solid fa-right-from-bracket"></i> خروج
                </button>
            </div>
        </div>
    </header>

    <!-- التبويبات الرئيسية -->
    <div class="max-w-7xl mx-auto px-4 mt-6 w-full">
        <nav class="flex space-x-2 space-x-reverse bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200">
            <button onclick="switchTab('apartments')" id="tab-apartments" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 bg-amber-500 text-slate-950 shadow-md">
                <i class="fa-solid fa-house-circle-check"></i> سجل العقارات والشقق
            </button>
            <button onclick="switchTab('add')" id="tab-add" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 text-slate-600 hover:bg-slate-100">
                <i class="fa-solid fa-circle-plus"></i> إضافة عقار جديد
            </button>
        </nav>
    </div>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">

        <!-- التبويب الأول: السجل -->
        <section id="section-apartments" class="space-y-6">
            <div class="glass-card rounded-2xl shadow-sm overflow-hidden border border-slate-200 bg-white">
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-slate-900 text-amber-400 text-xs uppercase tracking-wider">
                                <th class="py-3.5 px-4 font-bold">نوع العقار</th>
                                <th class="py-3.5 px-4 font-bold">حالة العرض</th>
                                <th class="py-3.5 px-4 font-bold">نوع العرض</th>
                                <th class="py-3.5 px-4 font-bold">المحافظة والمنطقة</th>
                                <th class="py-3.5 px-4 font-bold">السعر / القيمة</th>
                                <th class="py-3.5 px-4 font-bold">المندوب / المالك</th>
                                <th class="py-3.5 px-4 font-bold text-center">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="apartmentsTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- التبويب الثاني: إضافة عقار -->
        <section id="section-add" class="hidden max-w-4xl mx-auto">
            <div class="glass-card rounded-2xl p-6 shadow-sm border border-slate-200 bg-white">
                <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b">إضافة عقار جديد لنظام الشركة</h2>
                <form id="apartmentForm" onsubmit="handleAddProperty(event)" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">اسم مالك العقار *</label>
                            <input type="text" id="ownerName" required placeholder="أدخل اسم المالك" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">رقم تليفون المالك *</label>
                            <input type="text" id="ownerPhone" required placeholder="رقم الهاتف" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">نوع العرض</label>
                            <select id="dealType" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl font-bold">
                                <option value="للبيع">للبيع</option>
                                <option value="للإيجار">للإيجار</option>
                                <option value="للبدل">للبدل</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">نوع العقار</label>
                            <select id="propType" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl">
                                <option value="شقة">شقة</option>
                                <option value="دور كامل">دور كامل</option>
                                <option value="بيت">بيت</option>
                                <option value="أرض">أرض</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">السعر (د.ك)</label>
                            <input type="number" id="aptPrice" placeholder="السعر" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">المحافظة / المنطقة</label>
                        <input type="text" id="aptLocation" required placeholder="مثال: مدينة المطلاع السكنية - N1" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">ملاحظات إضافية</label>
                        <textarea id="aptNotes" rows="2" placeholder="ملاحظات العقار..." class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl"></textarea>
                    </div>

                    <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-xl transition shadow-lg">
                        <i class="fa-solid fa-floppy-disk"></i> حفظ العقار في نظام الشركة
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- البرمجة الشاملة داخل الملف لضمان عدم وجود أخطاء مسارات -->
    <script>
        let currentUser = JSON.parse(localStorage.getItem('kuwaiti_user')) || null;
        let apartments = JSON.parse(localStorage.getItem('kuwaiti_apartments')) || [];

        window.addEventListener('DOMContentLoaded', () => {
            if (currentUser) {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('currentUserBadge').innerText = currentUser;
            }
            renderTable();
        });

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUserSelect').value;
            const pass = document.getElementById('userPasswordInput').value;
            
            if (pass !== "") {
                currentUser = username;
                localStorage.setItem('kuwaiti_user', JSON.stringify(currentUser));
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('currentUserBadge').innerText = currentUser;
                renderTable();
            } else {
                alert("يرجى إدخال كلمة المرور!");
            }
        }

        function logout() {
            localStorage.removeItem('kuwaiti_user');
            location.reload();
        }

        function switchTab(tabId) {
            document.getElementById('section-apartments').classList.add('hidden');
            document.getElementById('section-add').classList.add('hidden');
            document.getElementById('tab-apartments').className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 text-slate-600 hover:bg-slate-100";
            document.getElementById('tab-add').className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 text-slate-600 hover:bg-slate-100";

            document.getElementById(`section-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 bg-amber-500 text-slate-950 shadow-md font-bold";
            if(tabId === 'apartments') renderTable();
        }

        function handleAddProperty(e) {
            e.preventDefault();
            const newApt = {
                id: "apt_" + Date.now(),
                ownerName: document.getElementById('ownerName').value,
                ownerPhone: document.getElementById('ownerPhone').value,
                dealType: document.getElementById('dealType').value,
                propType: document.getElementById('propType').value,
                price: document.getElementById('aptPrice').value || 0,
                location: document.getElementById('aptLocation').value,
                notes: document.getElementById('aptNotes').value,
                agent: currentUser || "مندوب",
                status: "متاحة"
            };

            apartments.push(newApt);
            localStorage.setItem('kuwaiti_apartments', JSON.stringify(apartments));
            alert("تم حفظ العقار بنجاح في النظام!");
            document.getElementById('apartmentForm').reset();
            switchTab('apartments');
        }

        function renderTable() {
            const tbody = document.getElementById('apartmentsTableBody');
            if(!tbody) return;
            tbody.innerHTML = '';

            if(apartments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400 font-bold">لا توجد عقارات مسجلة حالياً</td></tr>`;
                return;
            }

            apartments.forEach((apt, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="py-3.5 px-4 font-black text-slate-800">${apt.propType}</td>
                        <td class="py-3.5 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-black bg-emerald-100 text-emerald-800">${apt.status}</span></td>
                        <td class="py-3.5 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-black bg-slate-100 text-slate-800">${apt.dealType}</span></td>
                        <td class="py-3.5 px-4 font-bold text-slate-700">${apt.location}</td>
                        <td class="py-3.5 px-4 font-black text-slate-900">${Number(apt.price).toLocaleString()} د.ك</td>
                        <td class="py-3.5 px-4 font-bold text-slate-800">${apt.agent} <br><span class="text-xs text-emerald-700">${apt.ownerName} (${apt.ownerPhone})</span></td>
                        <td class="py-3.5 px-4 text-center">
                            <button onclick="deleteApartment(${index})" class="w-8 h-8 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 transition inline-flex items-center justify-center"><i class="fa-solid fa-trash text-xs"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function deleteApartment(index) {
            if(confirm("هل أنت متأكد من حذف هذا العقار؟")) {
                apartments.splice(index, 1);
                localStorage.setItem('kuwaiti_apartments', JSON.stringify(apartments));
                renderTable();
            }
        }
    </script>
</body>
</html>
